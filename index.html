<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Quick Knowledge Quiz</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #243247;
      --muted: #718096;
      --accent: #5276e8;
      --accent-dark: #3d5fc9;
      --border: #e2e8f0;
      --good: #dcfce7;
      --good-ink: #166534;
      --bad: #fee2e2;
      --bad-ink: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      width: min(620px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: clamp(22px, 5vw, 36px);
      box-shadow: 0 18px 55px rgba(35, 53, 85, .09);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -.04em;
    }
    .intro {
      margin: 9px 0 26px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }
    .progress-track {
      height: 9px;
      overflow: hidden;
      background: #edf1f8;
      border-radius: 99px;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transition: width .25s ease;
    }
    .question {
      margin: 26px 0 18px;
      font-size: 1.22rem;
      line-height: 1.4;
    }
    .answers { display: grid; gap: 11px; }
    .answer {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .answer:hover:not(:disabled), .answer:focus-visible {
      border-color: var(--accent);
      background: #f7f9ff;
      outline: none;
    }
    .answer:active:not(:disabled) { transform: scale(.995); }
    .answer:disabled { cursor: default; opacity: 1; }
    .answer.correct { border-color: #86d6a0; background: var(--good); color: var(--good-ink); }
    .answer.incorrect { border-color: #f2a0a0; background: var(--bad); color: var(--bad-ink); }
    .feedback {
      min-height: 26px;
      margin: 16px 0 4px;
      font-weight: 700;
      line-height: 1.45;
    }
    .actions { display: flex; justify-content: flex-end; margin-top: 14px; }
    .primary {
      border: 0;
      border-radius: 11px;
      padding: 12px 22px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    .primary:hover { background: var(--accent-dark); }
    .primary:focus-visible { outline: 3px solid #b9c8ff; outline-offset: 3px; }
    .hidden { display: none !important; }
    .result { text-align: center; padding: 16px 0 4px; }
    .result-icon { font-size: 3rem; margin-bottom: 8px; }
    .result h2 { margin: 0 0 8px; font-size: 1.8rem; }
    .result p { color: var(--muted); line-height: 1.55; }
    .score { margin: 18px 0; color: var(--accent); font-size: 2.2rem; font-weight: 850; }
    @media (max-width: 420px) {
      .app { border-radius: 17px; }
      .answer { padding: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">A little brain workout</p>
      <h1>Quick Knowledge Quiz</h1>
      <p class="intro">Eight simple questions. Choose an answer and see how you do!</p>
    </header>

    <section id="quiz" aria-live="polite">
      <div class="stats">
        <span id="question-count">Question 1 of 8</span>
        <span id="score-label">Score: 0</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" id="progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <h2 class="question" id="question">Loading question…</h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <div class="actions">
        <button class="primary hidden" id="next-button" type="button">Next question →</button>
      </div>
    </section>

    <section class="result hidden" id="result" aria-live="polite">
      <div class="result-icon" id="result-icon">🎉</div>
      <h2 id="result-title">Quiz complete!</h2>
      <p>You finished all eight questions.</p>
      <div class="score" id="final-score">0 / 8</div>
      <p id="result-message"></p>
      <button class="primary" id="restart-button" type="button">Try again</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1,
        fact: "Mars looks reddish because iron-rich dust covers much of its surface."
      },
      {
        question: "How many sides does a hexagon have?",
        options: ["Five", "Seven", "Six", "Eight"],
        answer: 2,
        fact: "A hexagon is a polygon with six sides."
      },
      {
        question: "Which animal is the largest mammal on Earth?",
        options: ["African elephant", "Blue whale", "Giraffe", "Polar bear"],
        answer: 1,
        fact: "The blue whale is the largest known animal to have ever lived."
      },
      {
        question: "What do plants absorb from the atmosphere for photosynthesis?",
        options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"],
        answer: 2,
        fact: "Plants use carbon dioxide, water and light to make sugars."
      },
      {
        question: "Which is the fastest land animal?",
        options: ["Cheetah", "Lion", "Horse", "Leopard"],
        answer: 0,
        fact: "A cheetah can reach very high speeds over short distances."
      },
      {
        question: "How many minutes are there in one hour?",
        options: ["50", "60", "70", "100"],
        answer: 1,
        fact: "One hour contains 60 minutes."
      },
      {
        question: "Which ocean is the largest?",
        options: ["Indian Ocean", "Atlantic Ocean", "Arctic Ocean", "Pacific Ocean"],
        answer: 3,
        fact: "The Pacific Ocean is the largest and deepest of Earth's ocean basins."
      },
      {
        question: "What is the main language spoken in Brazil?",
        options: ["Spanish", "Portuguese", "French", "English"],
        answer: 1,
        fact: "Portuguese is Brazil's official language."
      }
    ];

    // Fix the display text for the time question.
    questions[5].options = ["50", "60", "70", "100"];

    let current = 0;
    let score = 0;
    let locked = false;

    const $ = (id) => document.getElementById(id);
    const questionEl = $("question");
    const answersEl = $("answers");
    const feedbackEl = $("feedback");
    const nextButton = $("next-button");

    function renderQuestion() {
      locked = false;
      const item = questions[current];
      $("question-count").textContent = `Question ${current + 1} of ${questions.length}`;
      $("score-label").textContent = `Score: ${score}`;
      $("progress-fill").style.width = `${(current / questions.length) * 100}%`;
      $("progress").setAttribute("aria-valuenow", current);
      questionEl.textContent = item.question;
      feedbackEl.textContent = "";
      nextButton.classList.add("hidden");
      nextButton.textContent = current === questions.length - 1 ? "See results →" : "Next question →";
      answersEl.replaceChildren();

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = option;
        button.addEventListener("click", () => chooseAnswer(index));
        answersEl.appendChild(button);
      });
    }

    function chooseAnswer(selected) {
      if (locked) return;
      locked = true;
      const item = questions[current];
      const buttons = [...answersEl.querySelectorAll("button")];

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) button.classList.add("correct");
      });

      if (selected === item.answer) {
        score++;
        feedbackEl.textContent = `✓ That's right! ${item.fact}`;
      } else {
        buttons[selected].classList.add("incorrect");
        feedbackEl.textContent = `Not quite. The correct answer is ${item.options[item.answer]}. ${item.fact}`;
      }

      $("score-label").textContent = `Score: ${score}`;
      $("progress-fill").style.width = `${((current + 1) / questions.length) * 100}%`;
      $("progress").setAttribute("aria-valuenow", current + 1);
      nextButton.classList.remove("hidden");
    }

    function showResults() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;

      const percentage = score / questions.length;
      if (percentage === 1) {
        $("result-icon").textContent = "🏆";
        $("result-title").textContent = "Perfect score!";
        $("result-message").textContent = "Amazing work — you got every question right.";
      } else if (percentage >= 0.6) {
        $("result-icon").textContent = "🌟";
        $("result-title").textContent = "Great job!";
        $("result-message").textContent = "Nice work. You have a strong general knowledge base.";
      } else {
        $("result-icon").textContent = "💡";
        $("result-title").textContent = "Good effort!";
        $("result-message").textContent = "Keep practising. Every quiz is a chance to learn something new.";
      }
    }

    nextButton.addEventListener("click", () => {
      current++;
      if (current < questions.length) renderQuestion();
      else showResults();
    });

    $("restart-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
